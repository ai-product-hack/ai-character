<!doctype html>
<meta charset="utf-8">
<title>Тренажёр</title>
<link rel="stylesheet" href="/app/web/report.css">
<style>
 :root{color-scheme:dark}
 html,body{margin:0;height:100%;background:#05060a;color:#dde3ec;overflow:hidden;
   font:14px/1.5 -apple-system,system-ui,sans-serif}
 #stage{position:fixed;inset:0}
 canvas{display:block;width:100%;height:100%}
 #subs{position:fixed;left:0;right:34%;bottom:96px;text-align:center;
   font:500 22px/1.45 -apple-system,system-ui,sans-serif;color:#fff;
   text-shadow:0 2px 14px #000,0 0 30px #000;padding:0 40px;pointer-events:none}
 #side{position:fixed;top:0;right:0;bottom:0;width:33%;min-width:320px;
   background:#0b0e14e6;border-left:1px solid #232a38;display:flex;
   flex-direction:column;backdrop-filter:blur(6px)}
 #history{flex:1;overflow:auto;padding:12px 14px}
 .turn{margin-bottom:10px} .who{font-size:11px;color:#7c8697;letter-spacing:.04em}
 .agent .txt{color:#dde3ec} .user .txt{color:#7fd1ff}
 .turn.cut .txt{color:#9aa6b8}   /* оборванная реплика — глуше и с многоточием */
 #inputRow{border-top:1px solid #232a38;padding:10px 12px;display:flex;gap:8px}
 #msg{flex:1;font:inherit;background:#151a23;color:#dde3ec;border:1px solid #2c3547;
   border-radius:5px;padding:8px 10px}
 button{font:inherit;background:#1a1f28;color:#dde3ec;border:1px solid #2c3547;
   border-radius:5px;padding:8px 12px;cursor:pointer}
 #hud{position:fixed;top:10px;left:10px;font:12px/1.5 ui-monospace,monospace;
   color:#cfd6e4;background:#0b0e14cc;border:1px solid #232a38;border-radius:6px;
   padding:8px 10px;white-space:pre}
 #hudBtn{position:fixed;top:10px;left:10px;z-index:4;display:none}
 #err{position:fixed;left:10px;bottom:10px;right:36%;font:12px ui-monospace,monospace;
   color:#ff9a9a;background:#1a0d0dcc;border:1px solid #4a2222;border-radius:6px;
   padding:8px;white-space:pre-wrap;display:none;max-height:26vh;overflow:auto}
 #voiceRow{display:flex;gap:8px;align-items:center;padding:0 0 8px;
   font:12px ui-monospace,monospace;color:#8b96a8}
 #voice{font:inherit;background:#151a23;color:#dde3ec;border:1px solid #2c3547;
   border-radius:5px;padding:4px 6px}
 #voiceNote{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #micRow{display:flex;gap:8px;align-items:center;padding:0 0 8px;
   font:12px ui-monospace,monospace;color:#8b96a8}
 #micRow label{display:flex;gap:5px;align-items:center;cursor:pointer}
 #ptt{font:inherit;padding:4px 10px}
 #ptt[disabled]{opacity:.4;cursor:default}
 #ptt.live{background:#2a3550;border-color:#4a5a80}
 #micNote{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #micNote.bad{color:#ff9a9a}
 #micNote.hot{color:#9ad7a0}
 /* Панель — обычный HTML рядом с аватаром, к модулю лица отношения не имеет. */
 #panel{position:fixed;right:calc(36% + 18px);top:18px;width:300px;z-index:5;
   background:#0d1119ee;border:1px solid #232a38;border-radius:8px;padding:12px 14px;
   font:13px/1.5 system-ui,sans-serif;color:#dde3ec;
   opacity:0;transform:translateY(-6px);pointer-events:none;
   transition:opacity .22s ease,transform .22s ease}
 #panel.on{opacity:1;transform:none}
 #panelHead{font:12px ui-monospace,monospace;color:#8b96a8;letter-spacing:.04em;
   text-transform:uppercase;margin-bottom:10px}
 .skill{margin-bottom:9px}
 .skillTop{display:flex;justify-content:space-between;gap:10px}
 .skillTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .skillScore{font-variant-numeric:tabular-nums;color:#9ad7a0}
 .skillScore.none{color:#5c6678}
 .bar{height:4px;background:#1c2230;border-radius:2px;margin-top:4px;overflow:hidden}
 .bar i{display:block;height:100%;background:#4a7f5a;border-radius:2px}
 .skillWhy{color:#8b96a8;font-size:12px;margin-top:3px}
 /* Материал этапа: то, о чём агент спрашивает. */
 .matTitle{font-weight:600;margin-bottom:8px}
 .matRow{display:grid;grid-template-columns:64px 1fr 42px;gap:8px;
         align-items:center;margin-bottom:5px;font-size:12px}
 .matLabel{color:#8b96a8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .matValue{text-align:right;font-variant-numeric:tabular-nums;color:#9ad7a0}
 .matText{white-space:pre-wrap;font-size:13px;line-height:1.5}
 .stageRow{display:flex;gap:8px;padding:2px 0;color:#8b96a8}
 .stageRow.now{color:#dde3ec}
 .stageRow b{font-weight:600;color:#6f7c93;font-variant-numeric:tabular-nums}
 #panel pre{background:#0a0d13;border:1px solid #1c2230;border-radius:6px;
   padding:9px;overflow:auto;max-height:40vh;font:12px/1.45 ui-monospace,monospace}
 #voiceNote.bad{color:#ff9a9a}
 /* Отчёт на экране в момент finish. Жюри должно увидеть его сразу, а не
    скачивать файл, — поэтому он приходит поверх сцены, а не ссылкой. */
 #finish{position:fixed;inset:0;z-index:20;background:#0a0d12f2;overflow:auto;
   padding:28px 0;display:none}
 #finish.on{display:block}
 #finishInner{max-width:900px;margin:0 auto;padding:0 20px}
 #finishBar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
 #finishBar .grow{flex:1;color:#8b96a8;font-size:13px}
 /* Ворота: пока звук не разбужен, разговор не начинается. Браузер включает
    аудиоконтекст только по жесту, и без этого первая реплика уходила в
    тишину — человек видел молчащего аватара и не понимал, сломано ли. */
 #gate{position:fixed;inset:0;z-index:25;background:#05060af2;display:flex;
   align-items:center;justify-content:center}
 #gate.off{display:none}
 #gateBox{max-width:420px;text-align:center;padding:24px}
 #gateTitle{font-size:19px;font-weight:600;margin-bottom:8px}
 #gateText{color:#8b96a8;font-size:13px;line-height:1.5;margin:0 0 18px}
 #gateGo{font-size:15px;padding:10px 20px;border-color:#7fd1ff;color:#7fd1ff}
 /* На печати оверлей перестаёт быть оверлеем. Фиксированный контейнер со
    своей прокруткой браузер обрезает по первой странице: на экране отчёт
    целый, а в PDF от него остаётся шапка. Правило живёт здесь, а не в
    report.css: про #finish знает только этот экран. */
 @media print {
   #finish{position:static;display:block;overflow:visible;padding:0;
     background:#fff;inset:auto}
   #finishInner{max-width:none;padding:0}
 }

<script type="module">
import { createAvatar } from '/avatar/src/avatar.js';
import { renderReport } from '/app/web/report.js';
import { AudioClock, scheduleAudioClause, shiftTimeline } from '/avatar/src/clock.js';

const $ = id => document.getElementById(id);

// Сотрудник приходит по ссылке методиста: ?session=… Без неё берётся текущая
// сессия сервера — так открывали экран до появления ссылок, и ломать это
// незачем.
const SESSION = new URLSearchParams(location.search).get('session');
const api = (path) => SESSION
  ? path + (path.includes('?') ? '&' : '?') + 'session=' + encodeURIComponent(SESSION)
  : path;

const fail = e => { $('err').style.display='block';
  $('err').textContent += (e && e.stack ? e.stack : e) + '\n'; };
window.addEventListener('error', e => fail(e.error || e.message));
window.addEventListener('unhandledrejection', e => fail(e.reason));

let avatar, ctx, clock, analyser, currentGen = null, anchored = false;
let cues = [], emoMarks = [], emoApplied = -1;
let panelMarks = [], panelApplied = -1;
let contentAccented = false;
let lastContentSource = null;
const clauseSlipMs = new Map();
const backchannelSources = new Map();
const endedSources = new WeakSet();
const stats = {firstAudioMs: null, firstSpeechMs: null, firstTokenMs: null,
               clauses: 0, drops: 0, seq: 0, backchannels: 0,
               specHits: 0, specTries: 0, specCover: null,
               repaired: 0, emotions: 0, panels: 0, typing: null, lateAudioMs: 0,
               // Замеры БРАУЗЕРА, а не сервера: сервер знает, когда отдал
               // кадр, а слышно ли его — знает только эта сторона.
               heardMs: null, heardKind: '—', ctxState: '—'};

// Момент, когда человек передал ход: Enter или решение эндпоинтера.
let tAsk = null;

const clauseKey = h => `${h.generation_id}:${h.clause}`;

async function boot() {
  avatar = await createAvatar($('c'), {
    look: '/avatar/look.config.json',
    behavior: '/avatar/behavior.config.json',
    visemes: '/avatar/visemes.json',
    expression: '/avatar/expression.config.json',
  });
  avatar.setSize(innerWidth, innerHeight);
  await avatar.load();
  avatar.setSize(innerWidth, innerHeight);
  avatar.setState('listening');
  // Отладочный хук: те же числа, что на оверлее, плюс доступ к аудиографу.
  // Нужен для замеров пункта 9 и пригождается на защите.
  window.__app = {
    get avatar() { return avatar; },
    get ctx() { return ctx; },
    get clock() { return clock; },
    get analyser() { return analyser; },
    get currentGen() { return currentGen; },
    get cues() { return cues; },
    stats,
    send,
  };
  requestAnimationFrame(loop);
  // Кнопка ворот оживает только теперь: до этого `avatar` ещё не существует, и
  // нажатие упало бы внутри ensureAudio() на attachClock.
  $('gateGo').disabled = false;
  $('gateGo').textContent = 'начать разговор';
  // К потоку подключаемся ТОЛЬКО после жеста — см. ворота ниже. Кадры на
  // сервере копятся с самого старта сессии и отдаются с нулевого индекса,
  // так что ничего не теряется: первая реплика доиграет целиком, просто
  // начнётся тогда, когда её есть кому услышать.
}

// Ворота. Раньше клиент подключался сразу, первая реплика приходила до того,
// как человек успевал что-то нажать, и уходила в тишину: браузер держит
// аудиоконтекст в suspended до жеста. Человек видел молчащего аватара и не
// понимал, сломано ли. Побочно это же ломало часы аудио — таймлайн якорился
// в спящем контексте и после resume() разъезжался на десятки секунд.
$('gateGo').onclick = () => {
  $('gateGo').disabled = true;
  // resume() НЕ ждём. Он возвращает промис, который в некоторых окружениях
  // (нет устройства вывода, политика автовоспроизведения) не разрешается
  // никогда — и ворота, ждущие его, остаются закрытыми навсегда. Экран
  // мёртвый, и это хуже исходной беды. Жест — сам клик; он уже случился, и
  // разрешение браузер даёт по нему, а не по нашему ожиданию.
  ensureAudio();
  $('gate').classList.add('off');
  $('msg').focus();
  // Ошибка в цикле чтения раньше терялась молча, и выглядело это как «агент
  // замолчал»: кадры на сервере есть, клиент их не берёт. Теперь падение
  // видно, и поток переподключается.
  connectForever();
};

function ensureAudio() {
  if (!ctx) {
    ctx = new AudioContext();
    clock = new AudioClock(ctx);
    avatar.attachClock(clock);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.connect(ctx.destination);
    avatar.visemes.attachAnalyser(analyser);
  }
  // Без жеста пользователя браузер держит граф в suspended, и первая реплика
  // агента уходит в тишину: она приходит раньше, чем человек успевает что-то
  // нажать. Возобновляем при каждом обращении — дешевле, чем ловить момент.
  if (ctx.state === 'suspended') ctx.resume();
}

// -------------------------------------------------------------------- поток

async function connect() {
  const resp = await fetch(api('/api/stream?from=0'));
  // Экран сотрудника часто открывают раньше, чем методист нажал «начать».
  // Сервер в этот момент честно отвечает 400; это ожидание сессии, а не
  // фатальная ошибка клиента. Старый код дочитывал JSON как бинарный поток и
  // больше уже не подключался, поэтому после старта страница оставалась немой.
  if (resp.status === 400) return;
  if (!resp.ok) throw new Error(`поток: HTTP ${resp.status}`);
  const reader = resp.body.getReader();
  let acc = new Uint8Array(0);
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    const n = new Uint8Array(acc.length + value.length);
    n.set(acc); n.set(value, acc.length); acc = n;
    while (acc.length >= 8) {
      const dv = new DataView(acc.buffer, acc.byteOffset, acc.byteLength);
      const jl = dv.getUint32(0, true), pl = dv.getUint32(4, true);
      if (acc.length < 8 + jl + pl) break;
      const hdr = JSON.parse(new TextDecoder().decode(acc.subarray(8, 8+jl)));
      const payload = acc.subarray(8+jl, 8+jl+pl);
      acc = acc.subarray(8+jl+pl);
      // Разбор одного кадра не имеет права уронить чтение остальных.
      try { handle(hdr, payload); } catch (e) { fail(e); }
    }
  }
}

async function connectForever() {
  for (;;) {
    try { await connect(); }
    catch (e) { fail(e); }
    await new Promise(resolve => setTimeout(resolve, 500));
  }
}

function handle(h, payload) {
  if (h.seq !== undefined) stats.seq = h.seq;
  // Клиент безусловно дропает всё с чужим generation_id — та же защита,
  // что в S3: сервер мог отправить кадр до того, как узнал об отмене.
  if (h.generation_id && currentGen && h.generation_id !== currentGen) {
    stats.drops++;
    return;
  }
  if (h.kind === 'user') {
    if (h.typing) stats.typing = h.typing;
    addTurn('user', h.text);
    return;
  }
  if (h.kind === 'agent') {
    // Пузырь здесь НЕ закрываем. Этот кадр означает «все клаузы отправлены», а
    // не «человек дослушал»: конвейер работает с опережением, и на этот момент
    // колонки играют вторую фразу. Закрытие тут резало реплику надвое —
    // первый пузырь с парой слов, второй с полным текстом.
    //
    // Остаётся страховка: если по этой генерации в историю не попало ни слова
    // (не было звука, а значит и таймкодов), показываем текст разом.
    fallbackAgentTurn(h.generation_id, h.text);
    return;
  }
  if (h.kind === 'cancel') { onCancel(h.generation_id); return; }
  if (h.kind === 'finished') {
    // Отчёт ждёт, пока собеседник договорит. `finished` приходит, когда все
    // клаузы ОТПРАВЛЕНЫ, а колонки в этот момент играют вторую: раньше окно
    // выскакивало поверх говорящего аватара, и прощание уходило в него же.
    // Держим ту же лестницу, что и финальное состояние лица.
    const src = lastContentSource;
    const done = () => {
      addTurn('agent', '— диалог завершён —');
      finishSession();
      showFinishReport();
    };
    if (!src || endedSources.has(src)) done();
    else src.addEventListener('ended', () => setTimeout(done, 400), {once: true});
    return;
  }
  if (h.kind === 'state') {
    if (h.t_first_audio_ms) stats.firstAudioMs = h.t_first_audio_ms;
    if (h.t_first_speech_ms) stats.firstSpeechMs = h.t_first_speech_ms;
    if (h.t_first_token_ms) stats.firstTokenMs = h.t_first_token_ms;
    if (h.spec_cover !== null && h.spec_cover !== undefined) {
      stats.specTries++;
      stats.specCover = h.spec_cover;
      if (h.spec_hit) stats.specHits++;
    }
    if (h.repaired) stats.repaired++;
    // Сервер сам говорит, в каком состоянии быть лицу: после заполнителя это
    // thinking, пока идёт модель, и только потом speaking.
    const face = h.face || (h.finished ? 'listening' : 'speaking');
    if (h.after_ms) {
      // Состояние «thinking» после заполнителя должно начаться, когда «угу»
      // закончилось, а не в том же сетевом пакете, где оно только стартовало.
      const src = backchannelSources.get(h.generation_id);
      if (src) src.addEventListener('ended', () => {
        // Основная клауза могла успеть приехать и включить speaking ещё до
        // конца короткого «угу». В таком порядке старый callback не имеет
        // права снова увести глаза в thinking поверх уже начавшейся речи.
        if (currentGen === h.generation_id && !contentAccented) {
          avatar.setState(face);
        }
        backchannelSources.delete(h.generation_id);
      }, {once:true});
    } else if (h.after_audio) {
      // Финальное состояние приходит, когда все клаузы ОТПРАВЛЕНЫ, а не когда
      // колонки их доиграли. Держим speaking до конца последнего источника и
      // только затем возвращаем живое слушающее поведение.
      const src = lastContentSource;
      const apply = () => {
        if (currentGen !== h.generation_id) return;
        avatar.setState(face);
        // Реплика дозвучала — вот теперь пузырь в истории закончен. Тот же
        // момент, что и возврат лица в listening, и по той же причине: судить
        // надо по концу ЗВУКА, а не по концу отправки.
        closeLiveTurn(false);
      };
      if (!src || endedSources.has(src)) apply();
      else src.addEventListener('ended', apply, {once:true});
    } else {
      avatar.setState(face);
    }
    return;
  }
  if (h.kind === 'audio') {
    if (h.backchannel) stats.backchannels++;
    return playAudio(h, payload);
  }
  if (h.kind === 'visemes') {
    const track = shiftTimeline(h.track, clauseSlipMs.get(clauseKey(h)) || 0);
    if (h.clause === 0) avatar.playGeneration(h.generation_id, track);
    else avatar.visemes.appendVisemes(h.generation_id, track);
    return;
  }
  if (h.kind === 'subtitles') {
    // Признак заполнителя приходит на КАДРЕ, а в общий список едут отдельные
    // слова — переносим его на них, иначе «угу» попало бы в историю репликой.
    const marked = shiftTimeline(h.cues, clauseSlipMs.get(clauseKey(h)) || 0)
      .map(c => h.backchannel ? {...c, backchannel: true} : c);
    cues = cues.concat(marked);
    return;
  }
  if (h.kind === 'emotions') {
    stats.emotions += h.marks.length;
    const marks = shiftTimeline(h.marks, clauseSlipMs.get(clauseKey(h)) || 0);
    emoMarks = emoMarks.concat(marks).sort((a, b) => a.pts_ms - b.pts_ms);
    return;
  }
  if (h.kind === 'panels') {
    stats.panels += h.marks.length;
    // Панель едет по тому же PTS, что висемы и субтитры, и на ту же поправку
    // опоздавшего аудио: иначе она выедет раньше слов, которые объясняют,
    // что это такое.
    const marks = shiftTimeline(h.marks, clauseSlipMs.get(clauseKey(h)) || 0);
    panelMarks = panelMarks.concat(marks).sort((a, b) => a.pts_ms - b.pts_ms);
    return;
  }
}

function playAudio(h, payload) {
  ensureAudio();
  if (currentGen !== h.generation_id) {
    // Новая генерация: один якорь на всю реплику, как в S2.
    currentGen = h.generation_id;
    anchored = false;
    cues = [];
    emoMarks = []; emoApplied = -1;
    panelMarks = []; panelApplied = -1;
    stats.heardMs = null; stats.heardKind = '—';
    hidePanel();
    clauseSlipMs.clear();
    backchannelSources.clear();
    contentAccented = false;
    lastContentSource = null;
    stats.lateAudioMs = 0;
    stats.clauses = 0;
    avatar.setState('speaking');
  }
  const i16 = new Int16Array(payload.slice().buffer);
  const buf = ctx.createBuffer(1, i16.length, h.sample_rate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < i16.length; i++) ch[i] = i16[i] / 32768;
  if (!anchored) { clock.anchor(ctx.currentTime + 0.12); anchored = true; }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(analyser);
  const schedule = scheduleAudioClause(clock.t0, ctx.currentTime, h.start_ms);
  clauseSlipMs.set(clauseKey(h), schedule.slipMs);
  stats.lateAudioMs = Math.max(stats.lateAudioMs, Math.round(schedule.slipMs));
  if (h.backchannel) {
    backchannelSources.set(h.generation_id, src);
    avatar.speechAccent('backchannel');
  } else if (!contentAccented) {
    contentAccented = true;
    // Страховка протокола: содержательная речь после заполнителя идёт в той
    // же generation, поэтому ветка «новая генерация» выше не срабатывает.
    // Без явного возврата лицо оставалось в thinking и смотрело мимо человека.
    avatar.setState('speaking');
    avatar.speechAccent('speech');
  }
  if (!h.backchannel) lastContentSource = src;
  // Когда звук РЕАЛЬНО зазвучит: время старта источника, а не прихода кадра.
  // Расхождение с серверными 125 мс означает, что кадр доехал, но не прозвучал.
  if (tAsk !== null && stats.heardMs === null) {
    stats.heardMs = Math.round(performance.now() - tAsk
                               + Math.max(0, schedule.atSec - ctx.currentTime) * 1000);
    stats.heardKind = h.backchannel ? 'заполнитель' : 'реплика';
  }
  stats.ctxState = ctx.state;
  src.addEventListener('ended', () => endedSources.add(src), {once:true});
  src.start(schedule.atSec);
  stats.clauses++;
  live.push(src);
}

let live = [];

/** Сколько миллисекунд реплики человек успел услышать. null — речи не было. */
function heardNow() {
  if (!currentGen || !clock || clock.t0 === null) return null;
  const ms = clock.nowMs();
  return ms === null ? null : Math.max(0, Math.round(ms));
}

function onCancel(gid) {
  // Перебивание гасит звук, лицо, субтитры и эмоцию одним движением.
  closeLiveTurn(true);
  for (const s of live) { try { s.stop(); } catch (_) {} }
  live = [];
  avatar.cancel(gid);
  cues = [];
  emoMarks = []; emoApplied = -1;
  panelMarks = []; panelApplied = -1;
  hidePanel();                          // панель гаснет вместе со всем
  clauseSlipMs.clear();
  backchannelSources.clear();
  contentAccented = false;
  lastContentSource = null;
  avatar.setEmotion('neutral', 1);      // эмоция откатывается вместе со всем
  $('subs').textContent = '';
  currentGen = null;
  anchored = false;
}

// ---------------------------------------------------------------- субтитры

function loop(now) {
  requestAnimationFrame(loop);
  avatar.frame(now);
  drawSubs();
  applyEmotions();
  applyPanels();
  if ($('hud').style.display !== 'none') drawHud();
}

// Амплитуда умеренная: на полуреалистичном лице большая мимика превращает
// персонажа в мультик. Натекание и спад делает сам слой эмоции за 200 мс.
const EMO_INTENSITY = 0.68;

function applyEmotions() {
  if (!clock || clock.t0 === null || !emoMarks.length) return;
  const ms = clock.nowMs();
  if (ms === null) return;
  // Эмоция едет по тому же PTS, что висемы и субтитры: своего таймера нет.
  let i = emoApplied;
  while (i + 1 < emoMarks.length && emoMarks[i + 1].pts_ms <= ms) i++;
  if (i === emoApplied || i < 0) return;
  emoApplied = i;
  const m = emoMarks[i];
  avatar.setEmotion(m.emotion, EMO_INTENSITY * (m.intensity ?? 1));
}

// ------------------------------------------------------------------ панель

// Панель едет по тому же PTS, что висемы, субтитры и эмоции: своего таймера у
// неё нет, и гасится она той же отменой.
const PANEL_TITLES = {material: 'материал', scenario: 'этапы разговора',
                      code: 'код'};

function hidePanel() {
  $('panel').classList.remove('on');
}

function applyPanels() {
  if (!clock || clock.t0 === null || !panelMarks.length) return;
  const ms = clock.nowMs();
  if (ms === null) return;
  let i = panelApplied;
  while (i + 1 < panelMarks.length && panelMarks[i + 1].pts_ms <= ms) i++;
  if (i === panelApplied || i < 0) return;
  panelApplied = i;
  showPanel(panelMarks[i]);
}

function showPanel(mark) {
  if (mark.panel === 'close') return hidePanel();
  $('panelHead').textContent = PANEL_TITLES[mark.panel] || mark.panel;
  $('panelBody').innerHTML = renderPanel(mark);
  $('panel').classList.add('on');
}

const esc = t => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function renderPanel(mark) {
  const d = mark.data || {};
  if (mark.panel === 'material') {
    // Материал — то, О ЧЁМ спрашивает агент: график, документ, код. Данные
    // лежат в сценарии и приходят вместе с меткой, поэтому рисуем сразу.
    if (!d.kind) return '<div class="skillWhy">у этого этапа материала нет</div>';
    const head = d.title ? `<div class="matTitle">${esc(d.title)}</div>` : '';
    if (d.kind === 'chart') {
      const rows = d.series || [];
      const max = Math.max(1, ...rows.map(r => Math.abs(+r.value || 0)));
      return head + rows.map(r => {
        const v = +r.value || 0;
        return `<div class="matRow">
          <span class="matLabel">${esc(r.label)}</span>
          <span class="bar"><i style="width:${Math.abs(v) / max * 100}%"></i></span>
          <span class="matValue">${esc(r.value)}</span>
        </div>`;
      }).join('');
    }
    if (d.kind === 'code') {
      return head + `<pre>${esc(d.body)}</pre>`;
    }
    return head + `<div class="matText">${esc(d.body)}</div>`;
  }
  if (mark.panel === 'scenario') {
    return (d.stages || []).map((st, i) =>
      `<div class="stageRow${i === d.current ? ' now' : ''}">` +
      `<b>${i + 1}</b><span>${esc(st.goal || st.id)}</span></div>`).join('');
  }
  if (mark.panel === 'code') {
    return `<pre>${esc(d.code || '// код не передан')}</pre>`;
  }
  return '';
}

function drawSubs() {
  if (!clock || clock.t0 === null || !cues.length) return;
  const ms = clock.nowMs();
  if (ms === null) return;
  // Субтитры едут по тому же PTS, что и висемы: отдельного таймера нет.
  const shown = cues.filter(c => c.pts_ms <= ms + 60);
  $('subs').textContent = shown.slice(-14).map(c => c.text).join(' ');
  // История наполняется теми же словами и в тот же момент. Заполнитель
  // («угу», «так…») в историю не идёт: это не реплика, а звук ожидания.
  streamAgentWords(shown.filter(c => !c.backchannel).map(c => c.text));
}

function drawHud() {
  const d = avatar.debug();
  const v = d.viseme || {};
  const t = stats.typing;
  // Порядок строк — по важности на показе: сверху то, ради чего вся работа
  // (первый звук), снизу отладочное. Смотреть на него будут искоса.
  $('hud').textContent =
    `первый звук    ${stats.firstAudioMs ?? '—'} мс (сервер)\n` +
    `СЛЫШНО         ${stats.heardMs ?? '—'} мс — ${stats.heardKind}\n` +
    `аудиоконтекст  ${stats.ctxState}\n` +
    `реплика        ${stats.firstSpeechMs ?? '—'} мс\n` +
    `первый токен   ${stats.firstTokenMs ?? '—'} мс\n` +
    `спекуляция     ${stats.specHits}/${stats.specTries}` +
      (stats.specCover === null ? '' : `  покрытие ${stats.specCover}`) + `\n` +
    `эмоций         ${stats.emotions}  (сейчас ${d.emotion.name} ` +
      `${d.emotion.intensity.toFixed(2)})\n` +
    `панелей        ${stats.panels}\n` +
    `починок JSON   ${stats.repaired}\n` +
    `набор          ${t ? `${t.confidence}, пауза ${t.longest_pause_ms} мс` : '—'}\n` +
    `голос          ${$('voice').value || '—'}\n` +
    `\n` +
    `FPS            ${d.fps.toFixed(0)}\n` +
    `состояние      ${d.state}\n` +
    `generation_id  ${v.genId ?? '—'}\n` +
    `outputLatency  ${d.outputLatencyMs?.toFixed(1) ?? '—'} мс\n` +
    `дрейф          ${(v.drift_ms ?? 0).toFixed(1)} мс\n` +
    `опоздание аудио ${stats.lateAudioMs} мс\n` +
    `взгляд         ${(d.behavior?.gazeYaw ?? 0).toFixed(1)}° / ` +
      `${(d.behavior?.gazePitch ?? 0).toFixed(1)}°\n` +
    `висема         ${v.viseme ?? '—'} ${v.trackIndex ?? 0}/${v.trackLength ?? 0}\n` +
    `подвисаний     ${v.underruns ?? 0}\n` +
    `клауз          ${stats.clauses}\n` +
    `дропнуто чужих ${stats.drops}\n` +
    `кадров         ${stats.seq}`;
}

// ------------------------------------------------------------------- ввод

function addTurn(role, text) {
  const d = document.createElement('div');
  d.className = 'turn ' + role;
  d.innerHTML = `<div class="who">${role === 'agent' ? 'Агент' : 'Вы'}</div>` +
                `<div class="txt"></div>`;
  d.querySelector('.txt').textContent = text;
  $('history').appendChild(d);
  $('history').scrollTop = 1e9;
  return d;
}

// Реплика агента копится в истории ПО СЛОВАМ, вместе с речью, а не падает
// целиком в конце. Слова и их таймкоды уже есть — это те же метки, по которым
// едут субтитры, — поэтому отдельного таймера и второго источника правды не
// появляется. Заодно история перестаёт расходиться с услышанным: при
// перебивании в ней остаётся ровно то, что успело прозвучать.
// Пузырь принадлежит ГЕНЕРАЦИИ и закрывается ровно один раз. Без привязки к
// генерации и без флага «уже закрыт» реплика двоилась: пузырь закрывался, а
// слова продолжали идти и начинали второй — с самого начала и целиком.
let liveTurn = null, liveWords = 0, liveGen = null, liveDone = false;

function streamAgentWords(words) {
  if (!currentGen) return;
  if (liveGen !== currentGen) {          // новая реплика — новый пузырь
    liveTurn = null; liveWords = 0; liveDone = false; liveGen = currentGen;
  }
  if (liveDone || !words.length) return;  // закрытый пузырь не воскрешаем
  if (!liveTurn) liveTurn = addTurn('agent', '');
  if (words.length === liveWords) return;
  liveWords = words.length;
  liveTurn.querySelector('.txt').textContent = words.join(' ');
  $('history').scrollTop = 1e9;
}

/** Реплика прозвучала целиком, но в историю ничего не попало (не было звука
 *  и таймкодов). Показываем текст разом — молчащая история хуже несинхронной. */
function fallbackAgentTurn(gen, text) {
  if (!text || liveGen === gen && liveWords) return;
  liveGen = gen; liveDone = true; liveTurn = null; liveWords = 0;
  addTurn('agent', text);
}

/** Реплика закончилась или оборвана: следующая начнёт новый пузырь. */
function closeLiveTurn(interrupted) {
  if (liveTurn && interrupted && liveWords) {
    const txt = liveTurn.querySelector('.txt');
    txt.textContent = txt.textContent.replace(/[…]*$/, '') + '…';
    liveTurn.classList.add('cut');
  }
  liveDone = true;
  liveTurn = null;
  liveWords = 0;
}

// Диалог кончился — значит кончился. Раньше `finished` только рисовал строчку
// в истории: микрофон продолжал слушать, поле принимало текст, сервер отвечал.
// Человек говорил дальше в разговор, итог которого уже подведён и показан.
let sessionOver = false;

function finishSession() {
  if (sessionOver) return;
  sessionOver = true;
  micStop();
  $('micOn').checked = false;
  $('micOn').disabled = true;
  $('ptt').disabled = true;
  micSay('диалог завершён');
  $('msg').disabled = true;
  $('msg').value = '';
  $('msg').placeholder = 'Диалог завершён — отчёт готов';
  $('send').disabled = true;
  // Сервер тоже откажет (409), но ждать отказа, чтобы узнать очевидное, незачем.
  fetch(api('/api/voice'), {method: 'POST', body: JSON.stringify({on: false})})
    .catch(() => {});
}

async function send() {
  if (sessionOver) return;
  const text = $('msg').value.trim();
  if (!text) return;
  $('msg').value = '';
  ensureAudio();
  tAsk = performance.now();
  // Enter во время речи агента = перебивание: гасим локально сразу, не дожидаясь
  // сервера, иначе между нажатием и ответом сети звучит уже отменённое.
  //
  // Позицию воспроизведения снимаем ДО onCancel: он сбрасывает якорь часов, и
  // после него узнать, сколько человек успел услышать, уже не у кого. Сервер
  // знает только то, что ОТПРАВИЛ, а отправляет он с опережением — без этого
  // числа в историю попадал весь абзац, включая непрозвучавшее.
  const heardMs = heardNow();
  if (currentGen) { onCancel(currentGen); avatar.setState('interrupted'); }
  await fetch(api('/api/message'), {method:'POST',
                                    body: JSON.stringify({text, heard_ms: heardMs})});
}

// Отчёт показывается в момент finish — это прямое требование кейса. Он уже
// собран: фоновая сессия считала оценки по ходу разговора, здесь остаётся
// только забрать готовое.
let finishReport = null;

async function showFinishReport() {
  $('finishNote').textContent = 'собираю отчёт…';
  $('finish').classList.add('on');
  try {
    const rep = await (await fetch(api('/api/report'))).json();
    if (rep.error) throw new Error(rep.error);
    finishReport = rep;
    renderReport($('finishRep'), rep, {ns: 't'});
    $('finishNote').textContent = rep.saved_to
      ? 'JSON дописан: ' + rep.saved_to : '';
  } catch (e) {
    $('finishNote').textContent = 'отчёт не забрался: ' + (e.message || e);
  }
}

$('finishClose').onclick = () => $('finish').classList.remove('on');
$('finishPrint').onclick = () => window.print();
$('finishJson').onclick = () => {
  if (!finishReport) return;
  const blob = new Blob([JSON.stringify(finishReport, null, 2)],
                        {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `report_${finishReport.scenario_id}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};

$('send').onclick = send;
$('msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// Спекуляция на недопечатанном: сервер получает растущий текст и запускает
// запрос к модели, не дожидаясь Enter. Отправляем с задержкой — на каждое
// нажатие слать нечего, решение о запуске принимает сервер.
//
// Нетерпение аватара, наоборот, снимается на КАЖДОЕ нажатие и локально: ждать
// сети, чтобы не торопить человека, значит торопить его лишние 250 мс.
let typingTimer = null;
$('msg').addEventListener('input', () => {
  if (sessionOver) return;
  if (avatar) avatar.noteActivity();
  clearTimeout(typingTimer);
  const text = $('msg').value;
  typingTimer = setTimeout(() => {
    fetch(api('/api/typing'), {method:'POST', body: JSON.stringify({text})})
      .catch(() => {});           // спекуляция не имеет права ломать ввод
  }, 250);
});
// ------------------------------------------------------------- микрофон

// Голосовой ввод — второй путь, под тумблером. Текстовый остаётся основным и
// ничего об этом коде не знает: сюда микрофон не вмешивается никак.
//
// VAD и распознавание живут на сервере: и Silero VAD, и GigaAM уже подняты
// там, а тащить onnxruntime в браузер ради того, что уже работает, незачем.
// Браузер шлёт сырой PCM кусками по 100 мс.
const MIC_SR = 16000;
let micCtx = null, micStream = null, micNode = null, micSending = false;

function micSay(text, cls) {
  $('micNote').className = cls || '';
  $('micNote').textContent = text;
}

async function micStart() {
  // echoCancellation обязателен: без наушников микрофон услышит аватара, и
  // VAD оборвёт его же реплику. Наушники всё равно надёжнее, но это первая
  // линия защиты, а не украшение.
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true,
            channelCount: 1, sampleRate: MIC_SR}
  });
  // Отдельный контекст на нужной частоте: ресемплить на стороне сервера
  // значило бы гонять лишние байты и терять точность зря.
  micCtx = new AudioContext({sampleRate: MIC_SR});
  await micCtx.audioWorklet.addModule('/app/web/mic-worklet.js');
  micNode = new AudioWorkletNode(micCtx, 'mic-capture',
                                 {processorOptions: {chunkMs: 100}});
  micNode.port.onmessage = e => sendChunk(e.data);
  micCtx.createMediaStreamSource(micStream).connect(micNode);
  // Воркету нужен сток, иначе граф не тикает. Нулевая громкость: слышать себя
  // человек не должен.
  const mute = micCtx.createGain();
  mute.gain.value = 0;
  micNode.connect(mute).connect(micCtx.destination);
  micSending = true;
}

function micStop() {
  micSending = false;
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (micCtx) micCtx.close();
  micCtx = micStream = micNode = null;
}

async function sendChunk(f32) {
  if (!micSending || sessionOver) return;
  const i16 = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const v = Math.max(-1, Math.min(1, f32[i]));
    i16[i] = v * 32767;
  }
  try {
    const r = await fetch(api('/api/audio'), {method: 'POST', body: i16.buffer});
    const d = await r.json();
    if (d.endpoint) {
      tAsk = performance.now();
      if (d.text) micSay(`распознано за ${d.asr_ms} мс`, 'hot');
      else micSay('тишина — говорите', '');
    }
  } catch (e) { /* пропущенный кусок не должен ломать поток */ }
}

$('micOn').onchange = async () => {
  if (sessionOver) { $('micOn').checked = false; return; }
  const on = $('micOn').checked;
  if (!on) {
    micStop();
    $('ptt').disabled = true;
    await fetch(api('/api/voice'), {method:'POST', body: JSON.stringify({on: false})});
    micSay('выключен');
    return;
  }
  micSay('включаю…');
  try {
    const r = await fetch(api('/api/voice'), {method:'POST',
                                         body: JSON.stringify({on: true})});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    await micStart();
    $('ptt').disabled = false;
    micSay(`слушаю, порог тишины ${d.silence_ms ?? '—'} мс`, 'hot');
  } catch (e) {
    $('micOn').checked = false;
    micStop();
    micSay(String(e.message || e), 'bad');
  }
};

// Push-to-talk — аварийный режим: если VAD режет невпопад, конец хода можно
// объявить рукой. Кнопка не отключает VAD, а добавляет ручной выход.
async function pttUp() {
  $('ptt').classList.remove('live');
  if (!micSending) return;
  const d = await (await fetch(api('/api/voice'), {method:'POST',
                                              body: JSON.stringify({ptt: 'up'})})).json();
  if (d.text) micSay(`распознано за ${d.asr_ms} мс`, 'hot');
}
$('ptt').onpointerdown = () => {
  if (sessionOver) return;
  $('ptt').classList.add('live'); micSay('говорите…', 'hot');
};
$('ptt').onpointerup = pttUp;
$('ptt').onpointerleave = () => { if ($('ptt').classList.contains('live')) pttUp(); };

// ---------------------------------------------------------------- голос

// Переключение на ходу, без перезапуска сервера: на показе сравнивают голоса
// подряд, а подъём моделей стоит секунд. Сервер сам гасит текущую реплику и
// переозвучивает заполнители — иначе на стыке было бы слышно двух разных людей.
async function loadVoices() {
  try {
    const d = await (await fetch('/api/tts')).json();
    const options = d.provider_options || d.providers.map(p => ({provider:p, label:p}));
    $('voice').replaceChildren(...options.map(item => {
      const option = document.createElement('option');
      option.value = item.provider;
      option.textContent = item.label;
      return option;
    }));
    $('voice').value = d.tts.provider;
    showVoice(d.tts);
  } catch (e) { fail(e); }
}

function showVoice(tts) {
  const e = tts.engine || {};
  const name = e.name === 'fallback' ? (e.active || {}) : e;
  $('voiceNote').classList.remove('bad');
  $('voiceNote').textContent =
    `${name.voice ?? '—'}${name.offline === false ? ', сеть' : ', офлайн'}`;
}

$('voice').onchange = async () => {
  const provider = $('voice').value;
  const prev = $('voiceNote').textContent;
  $('voice').disabled = true;
  $('voiceNote').classList.remove('bad');
  $('voiceNote').textContent = 'переключаю…';
  try {
    const r = await fetch('/api/tts', {method:'POST',
                                       body: JSON.stringify({provider})});
    const d = await r.json();
    if (d.error) {
      $('voiceNote').classList.add('bad');
      $('voiceNote').textContent = d.error;
      // Вернуть только значение. loadVoices() заодно вызвал бы showVoice() и
      // мгновенно затёр полезную причину ошибки (например, отсутствующий key).
      const current = await (await fetch('/api/tts')).json();
      $('voice').value = current.tts.provider;
    } else {
      showVoice(d.tts);
      if (d.changed) onCancel(currentGen);  // реплика была погашена сервером
    }
  } catch (e) {
    $('voiceNote').classList.add('bad');
    $('voiceNote').textContent = prev;
    fail(e);
  } finally {
    $('voice').disabled = false;
  }
};

$('hudBtn').onclick = () => {
  const h = $('hud');
  h.style.display = h.style.display === 'none' ? 'block' : 'none';
  $('hudBtn').style.display = h.style.display === 'block' ? 'none' : 'block';
};
$('hud').onclick = () => { $('hud').style.display='none'; $('hudBtn').style.display='block'; };
addEventListener('resize', () => avatar && avatar.setSize(innerWidth, innerHeight));

// Любой первый клик по странице разблокирует аудиограф.
addEventListener('pointerdown', ensureAudio, {once: false});

boot().catch(fail);
loadVoices();
</script>
