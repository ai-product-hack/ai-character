<script type="importmap">
{"imports":{"three":"/avatar/node_modules/three/build/three.module.js",
            "three/addons/":"/avatar/node_modules/three/examples/jsm/"}}

<script type="module">
import { createAvatar } from '/avatar/src/avatar.js';
import { AudioClock, scheduleAudioClause, shiftTimeline } from '/avatar/src/clock.js';

const $ = id => document.getElementById(id);
const fail = e => { $('err').style.display='block';
  $('err').textContent += (e && e.stack ? e.stack : e) + '\n'; };
window.addEventListener('error', e => fail(e.error || e.message));
window.addEventListener('unhandledrejection', e => fail(e.reason));

let avatar, ctx, clock, analyser, currentGen = null, anchored = false;
let cues = [], emoMarks = [], emoApplied = -1;
let panelMarks = [], panelApplied = -1;
let contentAccented = false;
let lastContentSource = null;
const clauseSlipMs = new Map();
const backchannelSources = new Map();
const endedSources = new WeakSet();
const stats = {firstAudioMs: null, firstSpeechMs: null, firstTokenMs: null,
               clauses: 0, drops: 0, seq: 0, backchannels: 0,
               specHits: 0, specTries: 0, specCover: null,
               repaired: 0, emotions: 0, typing: null, lateAudioMs: 0};

const clauseKey = h => `${h.generation_id}:${h.clause}`;

async function boot() {
  avatar = await createAvatar($('c'), {
    look: '/avatar/look.config.json',
    behavior: '/avatar/behavior.config.json',
    visemes: '/avatar/visemes.json',
    expression: '/avatar/expression.config.json',
  });
  avatar.setSize(innerWidth, innerHeight);
  await avatar.load();
  avatar.setSize(innerWidth, innerHeight);
  avatar.setState('listening');
  // Отладочный хук: те же числа, что на оверлее, плюс доступ к аудиографу.
  // Нужен для замеров пункта 9 и пригождается на защите.
  window.__app = {
    get avatar() { return avatar; },
    get ctx() { return ctx; },
    get clock() { return clock; },
    get analyser() { return analyser; },
    get currentGen() { return currentGen; },
    get cues() { return cues; },
    stats,
    send,
  };
  requestAnimationFrame(loop);
  // Ошибка в цикле чтения раньше терялась молча, и выглядело это как «агент
  // замолчал»: кадры на сервере есть, клиент их не берёт. Теперь падение
  // видно, и поток переподключается.
  connectForever();
}

function ensureAudio() {
  if (!ctx) {
    ctx = new AudioContext();
    clock = new AudioClock(ctx);
    avatar.attachClock(clock);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.connect(ctx.destination);
    avatar.visemes.attachAnalyser(analyser);
  }
  // Без жеста пользователя браузер держит граф в suspended, и первая реплика
  // агента уходит в тишину: она приходит раньше, чем человек успевает что-то
  // нажать. Возобновляем при каждом обращении — дешевле, чем ловить момент.
  if (ctx.state === 'suspended') ctx.resume();
}

// -------------------------------------------------------------------- поток

async function connect() {
  const resp = await fetch('/api/stream?from=0');
  // Экран сотрудника часто открывают раньше, чем методист нажал «начать».
  // Сервер в этот момент честно отвечает 400; это ожидание сессии, а не
  // фатальная ошибка клиента. Старый код дочитывал JSON как бинарный поток и
  // больше уже не подключался, поэтому после старта страница оставалась немой.
  if (resp.status === 400) return;
  if (!resp.ok) throw new Error(`поток: HTTP ${resp.status}`);
  const reader = resp.body.getReader();
  let acc = new Uint8Array(0);
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    const n = new Uint8Array(acc.length + value.length);
    n.set(acc); n.set(value, acc.length); acc = n;
    while (acc.length >= 8) {
      const dv = new DataView(acc.buffer, acc.byteOffset, acc.byteLength);
      const jl = dv.getUint32(0, true), pl = dv.getUint32(4, true);
      if (acc.length < 8 + jl + pl) break;
      const hdr = JSON.parse(new TextDecoder().decode(acc.subarray(8, 8+jl)));
      const payload = acc.subarray(8+jl, 8+jl+pl);
      acc = acc.subarray(8+jl+pl);
      // Разбор одного кадра не имеет права уронить чтение остальных.
      try { handle(hdr, payload); } catch (e) { fail(e); }
    }
  }
}

async function connectForever() {
  for (;;) {
    try { await connect(); }
    catch (e) { fail(e); }
    await new Promise(resolve => setTimeout(resolve, 500));
  }
}

function handle(h, payload) {
  if (h.seq !== undefined) stats.seq = h.seq;
  // Клиент безусловно дропает всё с чужим generation_id — та же защита,
  // что в S3: сервер мог отправить кадр до того, как узнал об отмене.
  if (h.generation_id && currentGen && h.generation_id !== currentGen) {
    stats.drops++;
    return;
  }
  if (h.kind === 'user') {
    if (h.typing) stats.typing = h.typing;
    addTurn('user', h.text);
    return;
  }
  if (h.kind === 'agent') { addTurn('agent', h.text); return; }
  if (h.kind === 'cancel') { onCancel(h.generation_id); return; }
  if (h.kind === 'finished') { addTurn('agent', '— диалог завершён —'); return; }
  if (h.kind === 'state') {
    if (h.t_first_audio_ms) stats.firstAudioMs = h.t_first_audio_ms;
    if (h.t_first_speech_ms) stats.firstSpeechMs = h.t_first_speech_ms;
    if (h.t_first_token_ms) stats.firstTokenMs = h.t_first_token_ms;
    if (h.spec_cover !== null && h.spec_cover !== undefined) {
      stats.specTries++;
      stats.specCover = h.spec_cover;
      if (h.spec_hit) stats.specHits++;
    }
    if (h.repaired) stats.repaired++;
    // Сервер сам говорит, в каком состоянии быть лицу: после заполнителя это
    // thinking, пока идёт модель, и только потом speaking.
    const face = h.face || (h.finished ? 'listening' : 'speaking');
    if (h.after_ms) {
      // Состояние «thinking» после заполнителя должно начаться, когда «угу»
      // закончилось, а не в том же сетевом пакете, где оно только стартовало.
      const src = backchannelSources.get(h.generation_id);
      if (src) src.addEventListener('ended', () => {
        // Основная клауза могла успеть приехать и включить speaking ещё до
        // конца короткого «угу». В таком порядке старый callback не имеет
        // права снова увести глаза в thinking поверх уже начавшейся речи.
        if (currentGen === h.generation_id && !contentAccented) {
          avatar.setState(face);
        }
        backchannelSources.delete(h.generation_id);
      }, {once:true});
    } else if (h.after_audio) {
      // Финальное состояние приходит, когда все клаузы ОТПРАВЛЕНЫ, а не когда
      // колонки их доиграли. Держим speaking до конца последнего источника и
      // только затем возвращаем живое слушающее поведение.
      const src = lastContentSource;
      const apply = () => {
        if (currentGen === h.generation_id) avatar.setState(face);
      };
      if (!src || endedSources.has(src)) apply();
      else src.addEventListener('ended', apply, {once:true});
    } else {
      avatar.setState(face);
    }
    return;
  }
  if (h.kind === 'audio') {
    if (h.backchannel) stats.backchannels++;
    return playAudio(h, payload);
  }
  if (h.kind === 'visemes') {
    const track = shiftTimeline(h.track, clauseSlipMs.get(clauseKey(h)) || 0);
    if (h.clause === 0) avatar.playGeneration(h.generation_id, track);
    else avatar.visemes.appendVisemes(h.generation_id, track);
    return;
  }
  if (h.kind === 'subtitles') {
    cues = cues.concat(shiftTimeline(h.cues, clauseSlipMs.get(clauseKey(h)) || 0));
    return;
  }
  if (h.kind === 'emotions') {
    stats.emotions += h.marks.length;
    const marks = shiftTimeline(h.marks, clauseSlipMs.get(clauseKey(h)) || 0);
    emoMarks = emoMarks.concat(marks).sort((a, b) => a.pts_ms - b.pts_ms);
    return;
  }
  if (h.kind === 'panels') {
    stats.panels += h.marks.length;
    // Панель едет по тому же PTS, что висемы и субтитры, и на ту же поправку
    // опоздавшего аудио: иначе она выедет раньше слов, которые объясняют,
    // что это такое.
    const marks = shiftTimeline(h.marks, clauseSlipMs.get(clauseKey(h)) || 0);
    panelMarks = panelMarks.concat(marks).sort((a, b) => a.pts_ms - b.pts_ms);
    return;
  }
}

function playAudio(h, payload) {
  ensureAudio();
  if (currentGen !== h.generation_id) {
    // Новая генерация: один якорь на всю реплику, как в S2.
    currentGen = h.generation_id;
    anchored = false;
    cues = [];
    emoMarks = []; emoApplied = -1;
    panelMarks = []; panelApplied = -1;
    stats.heardMs = null; stats.heardKind = '—';
    hidePanel();
    clauseSlipMs.clear();
    backchannelSources.clear();
    contentAccented = false;
    lastContentSource = null;
    stats.lateAudioMs = 0;
    stats.clauses = 0;
    avatar.setState('speaking');
  }
  const i16 = new Int16Array(payload.slice().buffer);
  const buf = ctx.createBuffer(1, i16.length, h.sample_rate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < i16.length; i++) ch[i] = i16[i] / 32768;
  if (!anchored) { clock.anchor(ctx.currentTime + 0.12); anchored = true; }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(analyser);
  const schedule = scheduleAudioClause(clock.t0, ctx.currentTime, h.start_ms);
  clauseSlipMs.set(clauseKey(h), schedule.slipMs);
  stats.lateAudioMs = Math.max(stats.lateAudioMs, Math.round(schedule.slipMs));
  if (h.backchannel) {
    backchannelSources.set(h.generation_id, src);
    avatar.speechAccent('backchannel');
  } else if (!contentAccented) {
    contentAccented = true;
    // Страховка протокола: содержательная речь после заполнителя идёт в той
    // же generation, поэтому ветка «новая генерация» выше не срабатывает.
    // Без явного возврата лицо оставалось в thinking и смотрело мимо человека.
    avatar.setState('speaking');
    avatar.speechAccent('speech');
  }
  if (!h.backchannel) lastContentSource = src;
  // Когда звук РЕАЛЬНО зазвучит: время старта источника, а не прихода кадра.
  // Расхождение с серверными 125 мс означает, что кадр доехал, но не прозвучал.
  if (tAsk !== null && stats.heardMs === null) {
    stats.heardMs = Math.round(performance.now() - tAsk
                               + Math.max(0, schedule.atSec - ctx.currentTime) * 1000);
    stats.heardKind = h.backchannel ? 'заполнитель' : 'реплика';
  }
  stats.ctxState = ctx.state;
  src.addEventListener('ended', () => endedSources.add(src), {once:true});
  src.start(schedule.atSec);
  stats.clauses++;
  live.push(src);
}

let live = [];

function onCancel(gid) {
  // Перебивание гасит звук, лицо, субтитры и эмоцию одним движением.
  for (const s of live) { try { s.stop(); } catch (_) {} }
  live = [];
  avatar.cancel(gid);
  cues = [];
  emoMarks = []; emoApplied = -1;
  panelMarks = []; panelApplied = -1;
  hidePanel();                          // панель гаснет вместе со всем
  clauseSlipMs.clear();
  backchannelSources.clear();
  contentAccented = false;
  lastContentSource = null;
  avatar.setEmotion('neutral', 1);      // эмоция откатывается вместе со всем
  $('subs').textContent = '';
  currentGen = null;
  anchored = false;
}

// ---------------------------------------------------------------- субтитры

function loop(now) {
  requestAnimationFrame(loop);
  avatar.frame(now);
  drawSubs();
  applyEmotions();
  applyPanels();
  if ($('hud').style.display !== 'none') drawHud();
}

// Амплитуда умеренная: на полуреалистичном лице большая мимика превращает
// персонажа в мультик. Натекание и спад делает сам слой эмоции за 200 мс.
const EMO_INTENSITY = 0.68;

function applyEmotions() {
  if (!clock || clock.t0 === null || !emoMarks.length) return;
  const ms = clock.nowMs();
  if (ms === null) return;
  // Эмоция едет по тому же PTS, что висемы и субтитры: своего таймера нет.
  let i = emoApplied;
  while (i + 1 < emoMarks.length && emoMarks[i + 1].pts_ms <= ms) i++;
  if (i === emoApplied || i < 0) return;
  emoApplied = i;
  const m = emoMarks[i];
  avatar.setEmotion(m.emotion, EMO_INTENSITY * (m.intensity ?? 1));
}

// ------------------------------------------------------------------ панель

// Панель едет по тому же PTS, что висемы, субтитры и эмоции: своего таймера у
// неё нет, и гасится она той же отменой.
const PANEL_TITLES = {skills: 'карта навыков', scenario: 'этапы разговора',
                      code: 'код'};

function hidePanel() {
  $('panel').classList.remove('on');
}

function applyPanels() {
  if (!clock || clock.t0 === null || !panelMarks.length) return;
  const ms = clock.nowMs();
  if (ms === null) return;
  let i = panelApplied;
  while (i + 1 < panelMarks.length && panelMarks[i + 1].pts_ms <= ms) i++;
  if (i === panelApplied || i < 0) return;
  panelApplied = i;
  showPanel(panelMarks[i]);
}

function showPanel(mark) {
  if (mark.panel === 'close') return hidePanel();
  $('panelHead').textContent = PANEL_TITLES[mark.panel] || mark.panel;
  $('panelBody').innerHTML = renderPanel(mark);
  $('panel').classList.add('on');
}

const esc = t => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function renderPanel(mark) {
  const d = mark.data || {};
  if (mark.panel === 'skills') {
    if (!(d.rows || []).length) return '<div class="skillWhy">оценок пока нет</div>';
    // Данные уже посчитаны фоновой сессией — рисуем накопленное, не запрашиваем.
    return (d.rows || []).map(r => {
      const scale = r.scale || 5;
      const has = r.score !== null && r.score !== undefined;
      const pct = has ? Math.max(0, Math.min(100, r.score / scale * 100)) : 0;
      return `<div class="skill">
        <div class="skillTop">
          <span class="skillTitle">${esc(r.title || r.key)}</span>
          <span class="skillScore${has ? '' : ' none'}">${has ? r.score : '—'}</span>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        ${r.rationale ? `<div class="skillWhy">${esc(r.rationale)}</div>` : ''}
      </div>`;
    }).join('');
  }
  if (mark.panel === 'scenario') {
    return (d.stages || []).map((st, i) =>
      `<div class="stageRow${i === d.current ? ' now' : ''}">` +
      `<b>${i + 1}</b><span>${esc(st.goal || st.id)}</span></div>`).join('');
  }
  if (mark.panel === 'code') {
    return `<pre>${esc(d.code || '// код не передан')}</pre>`;
  }
  return '';
}

function drawSubs() {
  if (!clock || clock.t0 === null || !cues.length) return;
  const ms = clock.nowMs();
  if (ms === null) return;
  // Субтитры едут по тому же PTS, что и висемы: отдельного таймера нет.
  const shown = cues.filter(c => c.pts_ms <= ms + 60);
  $('subs').textContent = shown.slice(-14).map(c => c.text).join(' ');
}

function drawHud() {
  const d = avatar.debug();
  const v = d.viseme || {};
  const t = stats.typing;
  // Порядок строк — по важности на показе: сверху то, ради чего вся работа
  // (первый звук), снизу отладочное. Смотреть на него будут искоса.
  $('hud').textContent =
    `первый звук    ${stats.firstAudioMs ?? '—'} мс (сервер)\n` +
    `СЛЫШНО         ${stats.heardMs ?? '—'} мс — ${stats.heardKind}\n` +
    `аудиоконтекст  ${stats.ctxState}\n` +
    `реплика        ${stats.firstSpeechMs ?? '—'} мс\n` +
    `первый токен   ${stats.firstTokenMs ?? '—'} мс\n` +
    `спекуляция     ${stats.specHits}/${stats.specTries}` +
      (stats.specCover === null ? '' : `  покрытие ${stats.specCover}`) + `\n` +
    `эмоций         ${stats.emotions}  (сейчас ${d.emotion.name} ` +
      `${d.emotion.intensity.toFixed(2)})\n` +
    `панелей        ${stats.panels}\n` +
    `починок JSON   ${stats.repaired}\n` +
    `набор          ${t ? `${t.confidence}, пауза ${t.longest_pause_ms} мс` : '—'}\n` +
    `голос          ${$('voice').value || '—'}\n` +
    `\n` +
    `FPS            ${d.fps.toFixed(0)}\n` +
    `состояние      ${d.state}\n` +
    `generation_id  ${v.genId ?? '—'}\n` +
    `outputLatency  ${d.outputLatencyMs?.toFixed(1) ?? '—'} мс\n` +
    `дрейф          ${(v.drift_ms ?? 0).toFixed(1)} мс\n` +
    `опоздание аудио ${stats.lateAudioMs} мс\n` +
    `взгляд         ${(d.behavior?.gazeYaw ?? 0).toFixed(1)}° / ` +
      `${(d.behavior?.gazePitch ?? 0).toFixed(1)}°\n` +
    `висема         ${v.viseme ?? '—'} ${v.trackIndex ?? 0}/${v.trackLength ?? 0}\n` +
    `подвисаний     ${v.underruns ?? 0}\n` +
    `клауз          ${stats.clauses}\n` +
    `дропнуто чужих ${stats.drops}\n` +
    `кадров         ${stats.seq}`;
}

// ------------------------------------------------------------------- ввод

function addTurn(role, text) {
  const d = document.createElement('div');
  d.className = 'turn ' + role;
  d.innerHTML = `<div class="who">${role === 'agent' ? 'Агент' : 'Вы'}</div>` +
                `<div class="txt"></div>`;
  d.querySelector('.txt').textContent = text;
  $('history').appendChild(d);
  $('history').scrollTop = 1e9;
}

async function send() {
  const text = $('msg').value.trim();
  if (!text) return;
  $('msg').value = '';
  ensureAudio();
  tAsk = performance.now();
  // Enter во время речи агента = перебивание: гасим локально сразу, не дожидаясь
  // сервера, иначе между нажатием и ответом сети звучит уже отменённое.
  if (currentGen) { onCancel(currentGen); avatar.setState('interrupted'); }
  await fetch('/api/message', {method:'POST', body: JSON.stringify({text})});
}

$('send').onclick = send;
$('msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// Спекуляция на недопечатанном: сервер получает растущий текст и запускает
// запрос к модели, не дожидаясь Enter. Отправляем с задержкой — на каждое
// нажатие слать нечего, решение о запуске принимает сервер.
//
// Нетерпение аватара, наоборот, снимается на КАЖДОЕ нажатие и локально: ждать
// сети, чтобы не торопить человека, значит торопить его лишние 250 мс.
let typingTimer = null;
$('msg').addEventListener('input', () => {
  if (avatar) avatar.noteActivity();
  clearTimeout(typingTimer);
  const text = $('msg').value;
  typingTimer = setTimeout(() => {
    fetch('/api/typing', {method:'POST', body: JSON.stringify({text})})
      .catch(() => {});           // спекуляция не имеет права ломать ввод
  }, 250);
});
// ------------------------------------------------------------- микрофон

// Голосовой ввод — второй путь, под тумблером. Текстовый остаётся основным и
// ничего об этом коде не знает: сюда микрофон не вмешивается никак.
//
// VAD и распознавание живут на сервере: и Silero VAD, и GigaAM уже подняты
// там, а тащить onnxruntime в браузер ради того, что уже работает, незачем.
// Браузер шлёт сырой PCM кусками по 100 мс.
const MIC_SR = 16000;
let micCtx = null, micStream = null, micNode = null, micSending = false;

function micSay(text, cls) {
  $('micNote').className = cls || '';
  $('micNote').textContent = text;
}

async function micStart() {
  // echoCancellation обязателен: без наушников микрофон услышит аватара, и
  // VAD оборвёт его же реплику. Наушники всё равно надёжнее, но это первая
  // линия защиты, а не украшение.
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true,
            channelCount: 1, sampleRate: MIC_SR}
  });
  // Отдельный контекст на нужной частоте: ресемплить на стороне сервера
  // значило бы гонять лишние байты и терять точность зря.
  micCtx = new AudioContext({sampleRate: MIC_SR});
  await micCtx.audioWorklet.addModule('/app/web/mic-worklet.js');
  micNode = new AudioWorkletNode(micCtx, 'mic-capture',
                                 {processorOptions: {chunkMs: 100}});
  micNode.port.onmessage = e => sendChunk(e.data);
  micCtx.createMediaStreamSource(micStream).connect(micNode);
  // Воркету нужен сток, иначе граф не тикает. Нулевая громкость: слышать себя
  // человек не должен.
  const mute = micCtx.createGain();
  mute.gain.value = 0;
  micNode.connect(mute).connect(micCtx.destination);
  micSending = true;
}

function micStop() {
  micSending = false;
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (micCtx) micCtx.close();
  micCtx = micStream = micNode = null;
}

async function sendChunk(f32) {
  if (!micSending) return;
  const i16 = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const v = Math.max(-1, Math.min(1, f32[i]));
    i16[i] = v * 32767;
  }
  try {
    const r = await fetch('/api/audio', {method: 'POST', body: i16.buffer});
    const d = await r.json();
    if (d.endpoint) {
      tAsk = performance.now();
      if (d.text) micSay(`распознано за ${d.asr_ms} мс`, 'hot');
      else micSay('тишина — говорите', '');
    }
  } catch (e) { /* пропущенный кусок не должен ломать поток */ }
}

$('micOn').onchange = async () => {
  const on = $('micOn').checked;
  if (!on) {
    micStop();
    $('ptt').disabled = true;
    await fetch('/api/voice', {method:'POST', body: JSON.stringify({on: false})});
    micSay('выключен');
    return;
  }
  micSay('включаю…');
  try {
    const r = await fetch('/api/voice', {method:'POST',
                                         body: JSON.stringify({on: true})});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    await micStart();
    $('ptt').disabled = false;
    micSay(`слушаю, порог тишины ${d.silence_ms ?? '—'} мс`, 'hot');
  } catch (e) {
    $('micOn').checked = false;
    micStop();
    micSay(String(e.message || e), 'bad');
  }
};

// Push-to-talk — аварийный режим: если VAD режет невпопад, конец хода можно
// объявить рукой. Кнопка не отключает VAD, а добавляет ручной выход.
async function pttUp() {
  $('ptt').classList.remove('live');
  if (!micSending) return;
  const d = await (await fetch('/api/voice', {method:'POST',
                                              body: JSON.stringify({ptt: 'up'})})).json();
  if (d.text) micSay(`распознано за ${d.asr_ms} мс`, 'hot');
}
$('ptt').onpointerdown = () => { $('ptt').classList.add('live'); micSay('говорите…', 'hot'); };
$('ptt').onpointerup = pttUp;
$('ptt').onpointerleave = () => { if ($('ptt').classList.contains('live')) pttUp(); };

// ---------------------------------------------------------------- голос

// Переключение на ходу, без перезапуска сервера: на показе сравнивают голоса
// подряд, а подъём моделей стоит секунд. Сервер сам гасит текущую реплику и
// переозвучивает заполнители — иначе на стыке было бы слышно двух разных людей.
async function loadVoices() {
  try {
    const d = await (await fetch('/api/tts')).json();
    const options = d.provider_options || d.providers.map(p => ({provider:p, label:p}));
    $('voice').replaceChildren(...options.map(item => {
      const option = document.createElement('option');
      option.value = item.provider;
      option.textContent = item.label;
      return option;
    }));
    $('voice').value = d.tts.provider;
    showVoice(d.tts);
  } catch (e) { fail(e); }
}

function showVoice(tts) {
  const e = tts.engine || {};
  const name = e.name === 'fallback' ? (e.active || {}) : e;
  $('voiceNote').classList.remove('bad');
  $('voiceNote').textContent =
    `${name.voice ?? '—'}${name.offline === false ? ', сеть' : ', офлайн'}`;
}

$('voice').onchange = async () => {
  const provider = $('voice').value;
  const prev = $('voiceNote').textContent;
  $('voice').disabled = true;
  $('voiceNote').classList.remove('bad');
  $('voiceNote').textContent = 'переключаю…';
  try {
    const r = await fetch('/api/tts', {method:'POST',
                                       body: JSON.stringify({provider})});
    const d = await r.json();
    if (d.error) {
      $('voiceNote').classList.add('bad');
      $('voiceNote').textContent = d.error;
      // Вернуть только значение. loadVoices() заодно вызвал бы showVoice() и
      // мгновенно затёр полезную причину ошибки (например, отсутствующий key).
      const current = await (await fetch('/api/tts')).json();
      $('voice').value = current.tts.provider;
    } else {
      showVoice(d.tts);
      if (d.changed) onCancel(currentGen);  // реплика была погашена сервером
    }
  } catch (e) {
    $('voiceNote').classList.add('bad');
    $('voiceNote').textContent = prev;
    fail(e);
  } finally {
    $('voice').disabled = false;
  }
};

$('hudBtn').onclick = () => {
  const h = $('hud');
  h.style.display = h.style.display === 'none' ? 'block' : 'none';
  $('hudBtn').style.display = h.style.display === 'block' ? 'none' : 'block';
};
$('hud').onclick = () => { $('hud').style.display='none'; $('hudBtn').style.display='block'; };
addEventListener('resize', () => avatar && avatar.setSize(innerWidth, innerHeight));

// Любой первый клик по странице разблокирует аудиограф.
addEventListener('pointerdown', ensureAudio, {once: false});

boot().catch(fail);
loadVoices();
</script>
